[build-system]
requires = ["setuptools>=63", "wheel>=0.38"]
build-backend = "setuptools.build_meta"

[project]
name = "dac3d-iim-assistant"
version = "0.1.0"
description = "Chinese-first DAC-3D intelligent interaction assistant with local retrieval, mock DAC-3D integration, and optional Anthropic support."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.34.0",
  "chromadb>=0.5.0",
  "fastapi>=0.115.0",
  "gradio>=4.44.0",
  "openai-agents>=0.17.4",
  "python-multipart>=0.0.9",
  "pypdf>=5.0.0",
  "sentence-transformers>=3.0.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
dac3d-agent = "agent_runtime:main"
dac3d-generate-codex-handoff = "trace_eval.generate_codex_handoff:main"

[tool.setuptools]
py-modules = ["app", "agent_runtime", "config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_core*", "context_engineering*", "evals*", "goals*", "intent*", "integration*", "knowledge_base*", "machine_agent*", "memory*", "rag*", "safety*", "skill_system*", "tool_gateway*", "trace_eval*", "ui*", "pytest*"]
namespaces = true

[tool.setuptools.package-data]
machine_agent = ["documents/*.md"]
evals = ["cases/*.json"]
