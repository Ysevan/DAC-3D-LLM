[build-system]
requires = ["setuptools>=63", "wheel>=0.38"]
build-backend = "setuptools.build_meta"

[project]
name = "dac3d-iim-assistant"
version = "0.1.0"
description = "Chinese-first DAC-3D intelligent interaction assistant with local retrieval, mock DAC-3D integration, and optional Anthropic support."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.34.0",
  "chromadb>=0.5.0",
  "fastapi>=0.115.0",
  "gradio>=4.44.0",
  "python-multipart>=0.0.9",
  "pypdf>=5.0.0",
  "sentence-transformers>=3.0.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
py-modules = ["app", "config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["intent*", "integration*", "knowledge_base*", "rag*", "ui*", "pytest*"]
namespaces = true
