name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - security

permissions:
  contents: read

jobs:
  security:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dac3d_iim_assistant/pyproject.toml

      - name: Install Python dependencies
        working-directory: dac3d_iim_assistant
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit ruff bandit

      - name: Python tests
        working-directory: dac3d_iim_assistant
        run: pytest tests -q

      - name: Agent eval smoke
        working-directory: dac3d_iim_assistant
        run: |
          pytest tests/test_agent_runtime.py tests/test_security_evals.py -q
          python -m evals.run_security_evals

      - name: Python compile check
        working-directory: dac3d_iim_assistant
        run: python -m compileall .

      - name: Python lint
        working-directory: dac3d_iim_assistant
        run: ruff check .

      - name: Python security static analysis
        working-directory: dac3d_iim_assistant
        run: bandit -q -r . -x tests,pytest,frontend,ui2,knowledge_base/vector_store

      - name: Python dependency audit
        working-directory: dac3d_iim_assistant
        run: pip-audit

      - name: Secret and unsafe pattern scan
        run: python scripts/security_static_scan.py dac3d_iim_assistant

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            dac3d_iim_assistant/frontend/package-lock.json
            dac3d_iim_assistant/ui2/package-lock.json

      - name: Frontend dependency audit
        working-directory: dac3d_iim_assistant/frontend
        run: |
          npm ci
          npm audit --audit-level=moderate

      - name: Frontend build
        working-directory: dac3d_iim_assistant/frontend
        run: npm run build

      - name: UI2 dependency audit
        working-directory: dac3d_iim_assistant/ui2
        run: |
          npm ci
          npm audit --audit-level=moderate

      - name: UI2 build
        working-directory: dac3d_iim_assistant/ui2
        run: npm run build
